<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | TRIPZOVA</title>

    <link rel="stylesheet" href="reset-password.css">
</head>

<body>

    <main class="reset-page">

        <section class="reset-card">

            <!-- Left Visual -->
            <div class="reset-visual">
                <div class="visual-overlay"></div>
            </div>

            <!-- Right Form -->
            <div class="reset-form-section">

                <a href="login.html" class="back-button">
                    ←
                </a>

                <div class="form-content">

                    <h1>Reset your password</h1>

                    <p class="description">
                        Create a new password for your TRIPZOVA account.
                    </p>

                    <form id="resetPasswordForm">

                        <!-- New Password -->
                        <div class="input-group">

                            <label for="password">
                                New password
                            </label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="password"
                                    required
                                    minlength="8"
                                >

                                <button
                                    type="button"
                                    id="togglePassword"
                                    class="password-toggle"
                                >
                                    ◉
                                </button>

                            </div>

                        </div>

                        <!-- Confirm Password -->
                        <div class="input-group">

                            <label for="confirmPassword">
                                Confirm password
                            </label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    required
                                    minlength="8"
                                >

                                <button
                                    type="button"
                                    id="toggleConfirmPassword"
                                    class="password-toggle"
                                >
                                    ◉
                                </button>

                            </div>

                        </div>

                        <button
                            type="submit"
                            class="reset-btn"
                        >
                            Reset password
                        </button>

                    </form>

                    <div id="message"></div>

                    <p class="back-login">
                        Remember your password?
                        <a href="login.html">Log in</a>
                    </p>

                </div>

            </div>

        </section>

    </main>

    <script src="reset-password.js"></script>

</body>

</html>
