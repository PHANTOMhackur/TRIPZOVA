<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | TRIPZOVA</title>

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>


<body>

<main class="register-page">

    <section class="register-card">


        <!-- =========================================
             LEFT VISUAL
        ========================================== -->

        <div class="register-visual">

            <div class="visual-overlay"></div>

        </div>



        <!-- =========================================
             RIGHT FORM
        ========================================== -->

        <div class="register-form-section">


            <a
                href="user/index.html"
                class="back-button"
                aria-label="Go back"
            >
                ←
            </a>



            <div class="form-content">


                <h1>
                    Create an Account
                </h1>


                <p class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Log in
                    </a>

                </p>



                <!-- =================================
                     REGISTER FORM
                ================================== -->

                <form
                    id="registerForm"
                    novalidate
                >


                    <!-- =================================
                         FIRST + LAST NAME
                    ================================== -->

                    <div class="name-row">


                        <div class="input-group">

                            <label for="firstName">
                                First Name
                            </label>

                            <input
                                type="text"
                                id="firstName"
                                name="firstName"
                                autocomplete="given-name"
                                required
                            >

                        </div>



                        <div class="input-group">

                            <label for="lastName">
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                autocomplete="family-name"
                                required
                            >

                        </div>


                    </div>



                    <!-- =================================
                         EMAIL
                    ================================== -->

                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                        >

                    </div>



                    <!-- =================================
                         PHONE
                    ================================== -->

                    <div
                        class="input-group"
                        id="phoneGroup"
                    >

                        <label for="phone">
                            Phone Number
                        </label>


                        <div class="phone-row">


                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter 10-digit mobile number"
                                autocomplete="tel"
                                maxlength="13"
                                required
                            >


                            <button
                                type="button"
                                id="sendOtpBtn"
                                class="otp-btn"
                            >
                                Send OTP
                            </button>


                        </div>


                        <small class="field-hint">

                            We'll send a verification code
                            to your phone.

                        </small>


                    </div>



                    <!-- =================================
                         MSG91 CAPTCHA
                    ================================== -->

                    <div
                        id="msg91-captcha"
                        class="msg91-captcha"
                    ></div>



                    <!-- =================================
                         OTP
                    ================================== -->

                    <div
                        class="input-group"
                        id="otpGroup"
                        style="display:none;"
                    >


                        <label for="otp">
                            Verification Code
                        </label>


                        <div class="phone-row">


                            <input
                                type="text"
                                id="otp"
                                name="otp"
                                placeholder="Enter OTP"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                maxlength="9"
                            >


                            <button
                                type="button"
                                id="verifyOtpBtn"
                                class="otp-btn"
                            >
                                Verify OTP
                            </button>


                        </div>


                        <div
                            id="otpStatus"
                            class="otp-status"
                        ></div>


                    </div>



                    <!-- =================================
                         PARTNER CITY
                    ================================== -->

                    <div
                        class="input-group"
                        id="cityGroup"
                        style="display:none;"
                    >

                        <label for="city">
                            City
                        </label>


                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="Enter your city"
                            autocomplete="address-level2"
                        >

                    </div>



                    <!-- =================================
                         PARTNER ADDRESS
                    ================================== -->

                    <div
                        class="input-group"
                        id="addressGroup"
                        style="display:none;"
                    >

                        <label for="address">
                            Address
                        </label>


                        <input
                            type="text"
                            id="address"
                            name="address"
                            placeholder="Enter your address"
                            autocomplete="street-address"
                        >

                    </div>



                    <!-- =================================
                         PASSWORD
                    ================================== -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>


                        <div class="password-wrapper">


                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="new-password"
                                required
                            >


                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                ◉
                            </button>


                        </div>

                    </div>



                    <!-- =================================
                         CREATE ACCOUNT
                    ================================== -->

                    <button
                        type="submit"
                        class="create-account-btn"
                        id="createAccountBtn"
                    >
                        Create account
                    </button>



                    <!-- =================================
                         TERMS
                    ================================== -->

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>

                            I agree to the

                            <a href="#">
                                Terms &amp; Condition
                            </a>

                        </span>

                    </label>


                </form>



                <!-- =================================
                     MESSAGE
                ================================== -->

                <div id="message"></div>



                <!-- =================================
                     DIVIDER
                ================================== -->

                <div class="divider">

                    <span></span>

                    <p>OR</p>

                    <span></span>

                </div>



                <!-- =================================
                     ALTERNATIVE ACTIONS
                ================================== -->

                <div class="alternative-actions">


                    <button
                        type="button"
                        class="outline-btn"
                        id="googleSignup"
                    >

                        <span class="google-icon">
                            G
                        </span>

                        Continue with Google

                    </button>



                    <button
                        type="button"
                        class="outline-btn"
                        id="partnerSignup"
                    >

                        <span>
                            ▣
                        </span>

                        Register as partner

                    </button>


                </div>


            </div>

        </div>

    </section>

</main>



<!-- =================================================
     MSG91 OTP WIDGET
     ONLY ONE MSG91 SCRIPT
================================================== -->

    var configuration = {

        widgetId:
            "366961697156373631343138",

        tokenAuth:
            "566514TVOX0ahSF6a9698f1P1",

        identifier:
            "",

        exposeMethods:
            true,

        captchaRenderId:
            "msg91-captcha",

        success:
            function (data) {

                console.log(
                    "MSG91 success:",

                );

            },

        failure:

                    "MSG91 failure:",
                    error
                );

            }

    };

<script
    type="text/javascript"
    src="https://verify.msg91.com/otp-provider.js"
    onload="initSendOTP(configuration)"
></script>



<!-- =================================================
     TRIPZOVA REGISTER JS
================================================== -->

<script src="register.js"></script>


</body>

</html>
