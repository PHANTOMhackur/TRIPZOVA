<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Account Type | TRIPZOVA</title>

    <link rel="stylesheet" href="google-account-type.css">
</head>

<body>

    <main class="account-type-page">

        <section class="account-type-card">

            <div class="account-type-content">

                <div class="logo">
                    TRIPZOVA
                </div>

                <h1>Welcome to TRIPZOVA</h1>

                <p class="subtitle">
                    Choose how you want to use TRIPZOVA
                </p>

                <div id="userInfo" class="user-info"></div>

                <div class="account-options">

                    <!-- Traveller -->
                    <button
                        type="button"
                        class="account-option"
                        id="travellerBtn"
                    >
                        <div class="option-icon">
                            👤
                        </div>

                        <div class="option-text">
                            <h2>Continue as Traveller</h2>

                            <p>
                                Book cars and enjoy your journey
                            </p>
                        </div>

                        <span class="arrow">→</span>
                    </button>


                    <!-- Partner -->
                    <button
                        type="button"
                        class="account-option"
                        id="partnerBtn"
                    >
                        <div class="option-icon">
                            🚗
                        </div>

                        <div class="option-text">
                            <h2>Register as Partner</h2>

                            <p>
                                List your vehicle and earn with TRIPZOVA
                            </p>
                        </div>

                        <span class="arrow">→</span>
                    </button>

                </div>

                <div id="message"></div>

                <a href="login.html" class="back-login">
                    ← Back to Login
                </a>

            </div>

        </section>

    </main>

    <script src="google-account-type.js"></script>

</body>

</html>
